name: crc
description: "Rosary Companion - guides newcomers through praying the Catholic Rosary on Android, Android TV and the web."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1
  # Pinned toolchain; CI reads it via flutter-version-file (ADR-009).
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.5.6
  intl: any
  just_audio: ^0.10.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  crypto: ^3.0.7
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/prayers/
    - assets/data/mysteries/
    - assets/data/scripture/
    - assets/data/saints/
    - assets/audio/
    - assets/audio/en/
    - assets/audio/es/
    - assets/audio/fr/
