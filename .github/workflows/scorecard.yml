# OpenSSF Scorecard (DESIGN §7.1, ADR-032): grades the project's supply-chain
# practices (pinned actions, token permissions, branch protection, signed
# releases…) and lists what to improve under Security → Code scanning.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 6'
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      # Publishes the score to the public OpenSSF API (needed for the badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
