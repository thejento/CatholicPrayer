# OpenSSF Scorecard (DESIGN §7.1, ADR-042): grades the project's supply-chain
# practices (pinned actions, token permissions, branch protection, signed
# releases…) and lists what to improve under Security → Code scanning.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 6'
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      # Publishes the score to the public OpenSSF API (needed for the badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
