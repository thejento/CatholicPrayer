# Tag-driven release (DESIGN §7): push a tag like v1.2.0 to publish a
# GitHub Release with a signed Android App Bundle, an APK and a web zip.
#
# Signing secrets (ADR-012), all optional:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the build is debug-signed and the release is a pre-release.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets; building a debug-signed pre-release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=app/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build appbundle --release --build-name="$version" --build-number=${{ github.run_number }} --dart-define=APP_VERSION="$version"
          flutter build apk --release --build-name="$version" --build-number=${{ github.run_number }} --dart-define=APP_VERSION="$version"
          flutter build web --release --base-href /${{ github.event.repository.name }}/ --dart-define=APP_VERSION="$version"
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/rosary-companion-$version.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/rosary-companion-$version.apk"
          (cd build/web && zip -qr "../../dist/rosary-companion-web-$version.zip" .)

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            flags="$flags --prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" $flags
