# Keeps the voice recordings in sync with the texts (DESIGN §3.7, ADR-020).
#
# On a branch push that touches spoken text or the voice config, renders only
# the stale clips, commits them back to the branch, then approves the PR's CI
# run that the bot push opened (GitHub holds bot-triggered runs for approval).
name: Render audio

on:
  push:
    branches-ignore: [main]
    paths:
      - 'assets/data/**'
      - 'lib/src/l10n/*.arb'
      - 'lib/src/audio/clips.dart'
      - 'tool/tts/**'
      - '.github/workflows/render-audio.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: render-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Export spoken texts
        run: |
          flutter pub get
          flutter test tool/tts/export_texts_test.dart

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Find stale recordings
        id: stale
        run: |
          pip install -q numpy
          result=$(python tool/tts/render.py --check)
          echo "$result"
          echo "langs=$(echo "$result" | python -c 'import json,sys; print(",".join(json.load(sys.stdin)["languages"]))')" >> "$GITHUB_OUTPUT"
          echo "engines=$(echo "$result" | python -c 'import json,sys; print(",".join(json.load(sys.stdin)["engines"]))')" >> "$GITHUB_OUTPUT"

      - name: Cache Kokoro model
        if: contains(steps.stale.outputs.engines, 'kokoro')
        uses: actions/cache@v4
        with:
          path: build/tts/models
          key: kokoro-v1.0

      - name: Install Kokoro
        if: contains(steps.stale.outputs.engines, 'kokoro')
        run: |
          pip install kokoro-onnx
          mkdir -p build/tts/models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f build/tts/models/$f ] || curl -sSL -o build/tts/models/$f \
              https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done

      - name: Cache Chatterbox model
        if: contains(steps.stale.outputs.engines, 'chatterbox')
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-multilingual-v1

      - name: Install Chatterbox (CPU-only PyTorch)
        if: contains(steps.stale.outputs.engines, 'chatterbox')
        run: pip install chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Render
        if: steps.stale.outputs.langs != ''
        run: |
          pip install -q soundfile lameenc
          python tool/tts/render.py --langs "${{ steps.stale.outputs.langs }}"

      - name: Commit recordings and re-run CI
        if: steps.stale.outputs.langs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          git commit -m "Render voice clips (${{ steps.stale.outputs.langs }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          sha=$(git rev-parse HEAD)

          # A bot push opens the PR's CI run as "action_required". Branch
          # protection only counts PR-event runs, so approve that run.
          for _ in $(seq 1 12); do
            run=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=pull_request" \
              --jq '[.workflow_runs[] | select(.name == "CI")][0].id // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -n "$run" ] && gh api -X POST "repos/$REPO/actions/runs/$run/approve" >/dev/null 2>&1; then
            echo "Approved CI run $run for $sha"
          else
            # No open PR yet (CI runs when it is opened), or approval refused.
            gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
            echo "::notice::CI dispatched for $sha. If a PR is open and shows 'Approve workflows to run', approve it once."
          fi
