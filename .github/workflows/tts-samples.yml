# Design-phase job: renders Chatterbox voice samples for comparison (F-08).
# Removed once the voice is chosen and the production render job exists.
name: TTS samples

on:
  push:
    branches: [feat/tts]
    paths: ['tool/tts/**', '.github/workflows/tts-samples.yml']

permissions:
  contents: read

jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Chatterbox (CPU-only PyTorch)
        run: pip install chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Render samples
        run: |
          mkdir -p samples
          python tool/tts/sample_chatterbox.py . samples
      - uses: actions/upload-artifact@v7
        with:
          name: chatterbox-samples
          path: samples/
